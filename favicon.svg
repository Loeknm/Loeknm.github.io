<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg-a { stop-color: #f5f5f5; } .bg-b { stop-color: #8a8a8a; } .txt { fill: #050505; }
    @media (prefers-color-scheme: light) {
      .bg-a { stop-color: #0a0a0a; } .bg-b { stop-color: #6b6b6b; } .txt { fill: #f3f3f3; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg-a"/>
      <stop offset="1" class="bg-b"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#g)"/>
  <text x="32" y="33" class="txt" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5">LPC</text>
</svg>
